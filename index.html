<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Harmonium Pro - Authentic Tuning</title>
    <style>
        body {
            background-color: #e9ecef;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .main-container {
            width: 100%;
            max-width: 600px;
            background-color: #e9ecef;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .header {
            background-color: #009688;
            color: white;
            padding: 15px 20px;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .keyboard-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .keyboard {
            display: flex;
            position: relative;
            background: #fff;
            border: 1px solid #333;
            height: 150px;
        }

        .white-key {
            width: 30px;
            height: 100%;
            border: 1px solid #333;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 5px;
            font-size: 12px;
            box-sizing: border-box;
            cursor: pointer;
            z-index: 1;
        }

        .white-key.active { background-color: #ddd; }

        .key-label { color: #333; margin-bottom: 15px; }
        .note-label { color: #0000ff; font-weight: bold; }

        .black-key {
            width: 20px;
            height: 60%;
            background-color: #000;
            color: #fff;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            cursor: pointer;
            z-index: 2;
            top: 0;
            box-sizing: border-box;
        }
        
        .black-key.active { background-color: #333; }

        .bk-1 { left: 20px; }
        .bk-2 { left: 50px; }
        .bk-4 { left: 110px; }
        .bk-5 { left: 140px; }
        .bk-7 { left: 200px; }
        .bk-8 { left: 230px; }
        .bk-9 { left: 260px; }
        .bk-dash { left: 320px; }
        .bk-eq { left: 350px; }

        .panel {
            background-color: #fff;
            margin: 0 20px 20px 20px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .panel-header {
            background-color: #5d7e91;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .slider-container {
            background-color: #e0e0e0;
            height: 20px;
            position: relative;
            margin-bottom: 5px;
        }
        
        .slider-thumb {
            width: 30px;
            height: 20px;
            background-color: #78c278;
            position: absolute;
            left: 62%;
            cursor: pointer;
        }

        .toggle-switch {
            width: 50px;
            height: 24px;
            background-color: #2196F3;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            display: inline-block;
            vertical-align: middle;
        }
        
        .toggle-circle {
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            right: 2px;
        }

        .refresh-btn {
            background-color: white;
            border: none;
            width: 30px;
            height: 30px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .midi-select {
            width: 100%;
            max-width: 200px;
            display: block;
            margin: 0 auto;
            padding: 5px;
        }

        .transpose-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        
        .trans-btn {
            background-color: #999;
            border: none;
            color: black;
            width: 60px;
            padding: 10px;
            font-size: 18px;
            cursor: pointer;
        }
        
        .trans-val { font-size: 18px; }

    </style>
</head>
<body>

<div class="main-container">
    <div class="header">Web Harmonium</div>

    <!-- Keyboard configured to strict A=440Hz Equal Temperament Frequencies -->
    <div class="keyboard-container">
        <div class="keyboard">
            <div class="white-key" data-key="`" data-freq="246.94"><span class="key-label">`</span><span class="note-label"></span></div>
            <div class="white-key" data-key="q" data-freq="261.63"><span class="key-label">q</span><span class="note-label">C</span></div>
            <div class="white-key" data-key="w" data-freq="293.66"><span class="key-label">w</span><span class="note-label">D</span></div>
            <div class="white-key" data-key="e" data-freq="329.63"><span class="key-label">e</span><span class="note-label">E</span></div>
            <div class="white-key" data-key="r" data-freq="349.23"><span class="key-label">r</span><span class="note-label">F</span></div>
            <div class="white-key" data-key="t" data-freq="392.00"><span class="key-label">t</span><span class="note-label">G</span></div>
            <div class="white-key" data-key="y" data-freq="440.00"><span class="key-label">y</span><span class="note-label">A</span></div>
            <div class="white-key" data-key="u" data-freq="493.88"><span class="key-label">u</span><span class="note-label">B</span></div>
            <div class="white-key" data-key="i" data-freq="523.25"><span class="key-label">i</span><span class="note-label"></span></div>
            <div class="white-key" data-key="o" data-freq="587.33"><span class="key-label">o</span><span class="note-label"></span></div>
            <div class="white-key" data-key="p" data-freq="659.25"><span class="key-label">p</span><span class="note-label"></span></div>
            <div class="white-key" data-key="[" data-freq="698.46"><span class="key-label">[</span><span class="note-label"></span></div>
            <div class="white-key" data-key="]" data-freq="783.99"><span class="key-label">]</span><span class="note-label"></span></div>
            <div class="white-key" data-key="\\" data-freq="880.00"><span class="key-label">\</span><span class="note-label"></span></div>

            <div class="black-key bk-1" data-key="1" data-freq="277.18">1</div>
            <div class="black-key bk-2" data-key="2" data-freq="311.13">2</div>
            <div class="black-key bk-4" data-key="4" data-freq="369.99">4</div>
            <div class="black-key bk-5" data-key="5" data-freq="415.30">5</div>
            <div class="black-key bk-7" data-key="7" data-freq="466.16">7</div>
            <div class="black-key bk-8" data-key="8" data-freq="554.37">8</div>
            <div class="black-key bk-9" data-key="9" data-freq="622.25">9</div>
            <div class="black-key bk-dash" data-key="-" data-freq="739.99">-</div>
            <div class="black-key bk-eq" data-key="=" data-freq="830.61">=</div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">Volume: <span id="vol-display">62%</span></div>
        <div class="slider-container" id="vol-track">
            <div class="slider-thumb" id="vol-thumb"></div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">
            Reverb 
            <div class="toggle-switch">
                <div class="toggle-circle"></div>
            </div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">
            MIDI Keyboard Supported!
            <button class="refresh-btn">↻</button>
        </div>
        <select class="midi-select"></select>
    </div>

    <div class="panel">
        <div class="panel-header">Transpose - C</div>
        <div class="transpose-controls">
            <button class="trans-btn">-</button>
            <div class="trans-val">0</div>
            <button class="trans-btn">+</button>
        </div>
    </div>
</div>

<script>
    let audioCtx;
    const activeNotes = {};
    const masterVolume = 0.62;

    function playNote(freq, keyChar) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (activeNotes[keyChar]) return;

        // Custom Multi-Reed Harmonium Synthesis
        const masterGain = audioCtx.createGain();
        
        // Bellows envelope: Mimics physical air pressure building up
        masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
        masterGain.gain.linearRampToValueAtTime(masterVolume, audioCtx.currentTime + 0.08);

        // Lowpass filter simulates the wooden enclosure muffling harsh frequencies
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 3200; 
        filter.Q.value = 0.5;

        // Primary Reed (Sharp tone)
        const osc1 = audioCtx.createOscillator();
        osc1.type = 'sawtooth';
        osc1.frequency.value = freq;

        // Secondary Reed (Slightly detuned for chorusing "thickness")
        const osc2 = audioCtx.createOscillator();
        osc2.type = 'sawtooth';
        osc2.frequency.value = freq;
        osc2.detune.value = 8; 

        // Bass/Male Reed (Adds warm low-end resonance)
        const osc3 = audioCtx.createOscillator();
        osc3.type = 'square';
        osc3.frequency.value = freq / 2; 

        // Mixing the reeds
        const mix1 = audioCtx.createGain(); mix1.gain.value = 0.4;
        const mix2 = audioCtx.createGain(); mix2.gain.value = 0.4;
        const mix3 = audioCtx.createGain(); mix3.gain.value = 0.2;

        osc1.connect(mix1).connect(filter);
        osc2.connect(mix2).connect(filter);
        osc3.connect(mix3).connect(filter);
        
        filter.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        osc1.start(); 
        osc2.start(); 
        osc3.start();

        activeNotes[keyChar] = { osc1, osc2, osc3, masterGain };
        
        const el = document.querySelector(`[data-key="${keyChar}"]`);
        if(el) el.classList.add('active');
    }

    function stopNote(keyChar) {
        if (!activeNotes[keyChar]) return;
        const { osc1, osc2, osc3, masterGain } = activeNotes[keyChar];
        
        // Bellows release: Air escaping the reed blocks
        masterGain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        
        osc1.stop(audioCtx.currentTime + 0.15);
        osc2.stop(audioCtx.currentTime + 0.15);
        osc3.stop(audioCtx.currentTime + 0.15);
        
        delete activeNotes[keyChar];
        
        const el = document.querySelector(`[data-key="${keyChar}"]`);
        if(el) el.classList.remove('active');
    }

    document.addEventListener('keydown', (e) => {
        if (e.repeat) return;
        const key = e.key.toLowerCase();
        const el = document.querySelector(`[data-key="${key}"]`);
        if (el) playNote(parseFloat(el.getAttribute('data-freq')), key);
    });

    document.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        stopNote(key);
    });

    document.querySelectorAll('.white-key, .black-key').forEach(el => {
        const keyChar = el.getAttribute('data-key');
        const freq = parseFloat(el.getAttribute('data-freq'));
        el.addEventListener('mousedown', () => playNote(freq, keyChar));
        el.addEventListener('mouseup', () => stopNote(keyChar));
        el.addEventListener('mouseleave', () => stopNote(keyChar));
    });
</script>
</body>
</html>
